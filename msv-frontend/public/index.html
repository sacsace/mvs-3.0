<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <!-- 파비콘 교체 후 안 보이면 ?v= 값을 올리고 재빌드(또는 강력 새로고침 Ctrl+Shift+R) -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=5" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg?v=5" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D2B5B" />
    <meta
      name="description"
      content="MVS - 차세대 기업용 통합 업무 관리 시스템"
    />
    <!-- OS(브라우저) 언어에 따라 SEO 메타(title/description/lang)를 한글·영어로 초기 설정 -->
    <script>
      (function () {
        try {
          var raw = (navigator.language || navigator.userLanguage || 'ko').toLowerCase();
          var isKorean = raw.indexOf('ko') === 0;
          var seo = isKorean
            ? {
                lang: 'ko',
                title: 'MVS - 통합 업무 관리 시스템',
                description: 'MVS - 차세대 기업용 통합 업무 관리 시스템'
              }
            : {
                lang: 'en',
                title: 'MVS - Integrated Business Management System',
                description: 'MVS - Next-generation enterprise business management system'
              };
          document.documentElement.lang = seo.lang;
          document.title = seo.title;
          var descTag = document.querySelector('meta[name="description"]');
          if (descTag) descTag.setAttribute('content', seo.description);
        } catch (e) {
          /* 언어 감지 실패 시 정적 한글 메타 유지 */
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png?v=5" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
    />
    <title>MVS - 통합 업무 관리 시스템</title>
  </head>
  <body>
    <noscript>JavaScript를 활성화해야 이 앱을 실행할 수 있습니다.</noscript>
    <div id="root"></div>
  </body>
</html>
